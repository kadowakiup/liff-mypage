<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アカウント情報</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <div class="menu-container">
      <h2>アカウント・条件情報</h2>

      <!-- ▼ アカウント情報：Neo Quick Call -->
      <div class="card">
        <h3 class="card-title">Neo Quick Call</h3>
        <div id="nqc-data-content" class="data-content">読み込み中...</div>
      </div>
      
      <!-- ▼ 情報確認ボタン -->
      <div class="button-group">
       <!-- 打刻・シフトルール（上段：横長のまま） -->
<button id="btn-rule" class="menu-btn notion-btn">
  📖 打刻・シフトルール
</button>

<!-- 給与条件（下段：横並び） -->
<div class="salary-buttons-wrapper">
  <!-- 今月分（目立つ色） -->
  <button id="btn-salary-current" class="btn-square btn-current">
    <span class="btn-icon">💰</span>
    <span class="btn-text">今月<br>給与条件</span>
  </button>

  <!-- 先月分（控えめな色） -->
  <button id="btn-salary-prev" class="btn-square btn-prev">
    <span class="btn-icon">🕒</span>
    <span class="btn-text">先月<br>給与条件</span>
  </button>
</div>

    </div>
  </body>
</html>
