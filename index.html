<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アカウント情報</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <div class="menu-container">
      <h2>アカウント・条件情報</h2>

      <!-- ▼ アカウント情報：Neo Quick Call -->
      <div class="card">
        <h3 class="card-title">Neo Quick Call</h3>
        <div id="nqc-data-content" class="data-content">読み込み中...</div>
      </div>
      
      <!-- ▼ 情報確認ボタン -->
      <div class="button-group">
        <button id="btn-rule" class="menu-btn">📖 打刻・シフトルール</button>
        <button id="btn-salary" class="menu-btn">💰 給与条件</button>
      </div>

      <!-- ▼ ボタンを押した時の詳細表示エリア -->
      <div id="details-container" class="details-container">
        <h3 id="details-title" class="details-title">タイトル</h3>
        <div id="details-content" class="details-content">
          内容がここに表示されます。
        </div>
      </div>

    </div>
  </body>
</html>
