<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マイページ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- ★ v=5 に変更してキャッシュをクリア -->
    <link rel="stylesheet" href="style.css?v=6">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="index.js?v=4"></script>
  </head>
  <body>
    <!-- ローディング画面 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: flex;">
      <div class="loading-content">
        <div class="cute-dots">
          <span></span><span></span><span></span>
        </div>
        <p>データ読み込み中...<br>少々お待ちください</p>
      </div>
    </div>

    <!-- 全体がゆっくり動く波模様 -->
    <div class="wave-container">
      <div class="wave wave1"></div>
      <div class="wave wave2"></div>
      <div class="wave wave3"></div>
    </div>

    <div class="app-container">
      <!-- ヘッダー -->
      <header class="page-header">
        <div class="header-text">
          <span class="greeting">こんにちは</span>
          <h1 class="username"><span id="display-name">ゲスト</span>さん</h1>
        </div>
        <div class="profile-icon">
          <img id="profile-img" src="https://via.placeholder.com/150/cccccc/ffffff?text=👤" alt="profile">
        </div>
      </header>

      <main>
        <!-- ▼ 月間アポ効率 -->
        <section id="apo-card" class="glass-card main-card">
          <div class="card-header">
            <h2 class="card-title">今月の月間アポ効率</h2>
          </div>
          <div id="apo-data-content" class="data-content">読み込み中...</div>
        </section>

        <!-- ▼ Neo Quick Call -->
        <section id="nqc-card" class="glass-card sub-card">
          <h2 class="card-title">Neo Quick Call</h2>
          <div id="nqc-data-content" class="data-content">読み込み中...</div>
        </section>
        
        <!-- ▼ 各種リンクボタン -->
        <section class="action-section">
          <button id="btn-rule" class="glass-btn btn-full">
            <span class="btn-icon">📖</span> 打刻・シフトルール
          </button>

          <div class="salary-buttons-wrapper">
            <button id="btn-salary-current" class="glass-btn btn-half">
              <span class="btn-icon">💰</span>
              <div class="btn-text">今月分<br>給与条件</div>
            </button>
            <button id="btn-salary-prev" class="glass-btn btn-half outline">
              <span class="btn-icon">🕒</span>
              <div class="btn-text">先月分<br>給与条件</div>
            </button>
          </div>
        </section>
      </main>
    </div>

    <!-- ★ 追加：冬の装飾（雪と雪だるま） -->
    <div class="winter-scene">
      <div class="snowflakes">
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❅</div>
      </div>
      <div class="snowman-container">
        <div class="snowman-head">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="nose"></div>
          <div class="scarf"></div>
          <div class="scarf-tail"></div>
        </div>
        <div class="snowman-body">
          <div class="button"></div>
          <div class="button"></div>
        </div>
      </div>
    </div>
  </body>
</html>
